# F2S2G 全局配置文件
# 所有路径均相对于本文件所在目录，也可使用绝对路径

seed: 42

# ============ 数据路径 ============
data:
  task_a:
    source_a: "../物业处的目标输出数据：小区基础信息数据.sql"
    source_b: "../房屋交易中心合并数据.csv"
    labels: "../匹配映射.csv"
    field_mapping: "configs/field_mapping_a.yaml"
  task_b:
    source_ab: "../房屋数据合并表格_英文表头是奥格科技的数据_中文表头是征收处数据.xlsx"
    field_mapping: "configs/field_mapping_b.yaml"

# ============ 配置文件路径 ============
configs:
  enum_alias: "configs/enum_alias.yaml"
  graph: "configs/graph_config.yaml"

# ============ 输出目录 ============
output_dir: "output"

# ============ 数据划分 ============
split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  stratify_by: "区县"

# ============ Stage 2: Semantic 参数 ============
semantic:
  analyzer: "char"
  ngram_range: [2, 4]
  min_df: 2
  svd_components: 32

# ============ Stage 3: Graph 辅助边 ============
# 注意：辅助边数量过多会淹没匹配信号导致过度平滑
# 建议先关闭辅助边跑baseline，确认模型能学到匹配后再逐步开启
graph:
  enable_same_district: false
  enable_geo_near: false
  geo_near_threshold_m: 500
  enable_same_company: false

# ============ 外部知识增强 ============
knowledge_enhance:
  enabled: true
  top_k: 3
  tau_conf: 0.5
  long_tail_threshold: 1

# ============ 模型参数 ============
model:
  backbone: "lightgcn"          # lightgcn / gat / rgcn / dgrec
  embedding_dim: 32
  num_layers: 2                 # 稀疏图上2层比3层效果好，避免过度平滑
  dropout: 0.0

# ============ 训练参数 ============
training:
  epochs: 200
  batch_size: 256
  learning_rate: 0.01
  weight_decay: 0.0
  patience: 10
  neg_ratio: 4
  neg_strategy:
    easy_ratio: 0.4
    medium_ratio: 0.4
    hard_ratio: 0.2
    hard_sim_range: [0.3, 0.6]
  loss:
    type: "infonce"
    temperature: 0.1
    class_balance_beta: 0.9999

# ============ 推理参数 ============
inference:
  coarse_top_k: 50
  final_top_k: 10

# ============ 设备 ============
device: "auto"                   # auto / cuda / cpu
